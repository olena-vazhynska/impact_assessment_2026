name: Build revised gender-responsive OSH energy deck

on:
  push:
    branches:
      - chatgpt-modern-energy-deck
    paths:
      - 'deck-build/**'
      - '.github/workflows/build-modern-inclusive-energy-deck.yml'
  workflow_dispatch:

concurrency:
  group: revised-energy-deck
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt-modern-energy-deck
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: deck-build/package.json

      - name: Install dependencies and rendering tools
        run: |
          cd deck-build
          npm install
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils fonts-noto-core fonts-noto-extra file

      - name: Download official logo and licensed photographs
        shell: bash
        run: |
          set +e
          mkdir -p deck-build/assets
          get_img() {
            out="$1"; url="$2"
            curl -fL --retry 2 --retry-delay 1 --connect-timeout 7 --max-time 25 -A 'Mozilla/5.0' -o "$out" "$url"
            if [ $? -ne 0 ] || ! file --mime-type "$out" 2>/dev/null | grep -q 'image/'; then
              rm -f "$out"
              echo "Optional image unavailable: $out"
            fi
          }
          get_img deck-build/assets/itcilo_logo.png 'https://extranet.itcilo.org/promotionbanners/itcilo_logo_maled.png/@@images/image'
          get_img deck-build/assets/cover_workers_ukraine.jpg 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Wind_Turbine_with_Workers_-_Boryspil_-_Ukraine_(43478128644).jpg'
          get_img deck-build/assets/solar_workers.jpg 'https://images.pexels.com/photos/8853507/pexels-photo-8853507.jpeg?auto=compress&cs=tinysrgb&w=1600'
          get_img deck-build/assets/repairs.jpg 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Transmission_system_repairs_underway,_Oct._3_(37445616056).jpg'
          ls -lh deck-build/assets || true
          exit 0

      - name: Generate revised PowerPoint
        run: |
          cd deck-build
          node build_revised.js
          test -s Modern_and_Inclusive_Energy_Work_for_the_Future_REVISED.pptx

      - name: Validate PowerPoint package
        run: |
          python - <<'PY'
          import zipfile
          p='deck-build/Modern_and_Inclusive_Energy_Work_for_the_Future_REVISED.pptx'
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
              assert '[Content_Types].xml' in names
              assert 'ppt/presentation.xml' in names
              slides=[n for n in names if n.startswith('ppt/slides/slide') and n.endswith('.xml')]
              notes=[n for n in names if n.startswith('ppt/notesSlides/notesSlide') and n.endswith('.xml')]
              assert len(slides)==24, len(slides)
              assert len(notes)==24, len(notes)
          print(f'PPTX package valid with {len(slides)} slides and {len(notes)} notes pages')
          PY

      - name: Render with LibreOffice
        run: |
          mkdir -p deck-build/rendered-revised
          libreoffice --headless --convert-to pdf --outdir deck-build/rendered-revised deck-build/Modern_and_Inclusive_Energy_Work_for_the_Future_REVISED.pptx
          test -s deck-build/rendered-revised/Modern_and_Inclusive_Energy_Work_for_the_Future_REVISED.pdf
          pdfinfo deck-build/rendered-revised/Modern_and_Inclusive_Energy_Work_for_the_Future_REVISED.pdf | grep 'Pages: *24'

      - name: Upload revised presentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: revised-gender-responsive-osh-energy-deck
          path: |
            deck-build/Modern_and_Inclusive_Energy_Work_for_the_Future_REVISED.pptx
            deck-build/rendered-revised/Modern_and_Inclusive_Energy_Work_for_the_Future_REVISED.pdf
          if-no-files-found: error
          retention-days: 7

      - name: Commit revised presentation
        run: |
          git config user.name 'ChatGPT Deck Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deck-build/Modern_and_Inclusive_Energy_Work_for_the_Future_REVISED.pptx
          if git diff --cached --quiet; then
            echo 'No generated-file change to commit.'
          else
            git commit -m 'Add revised gender-responsive OSH energy deck [skip ci]'
            git push origin chatgpt-modern-energy-deck
          fi
